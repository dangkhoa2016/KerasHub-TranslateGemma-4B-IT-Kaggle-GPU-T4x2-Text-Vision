name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU-only test dependencies
        run: python -m pip install "Flask==3.1.3" "Pillow>=10" "numpy>=1.26"
      - name: Shell syntax
        run: for f in scripts/*.sh tests/*.sh; do bash -n "$f"; done
      - name: Python syntax
        run: python -m compileall -q src tests
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Setup .env ordering test
        run: bash tests/test_setup_env.sh
      - name: Validate public repository
        run: python scripts/validate_public_repo.py
      - name: Notebook JSON validation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          found = False
          for path in Path(".").rglob("*.ipynb"):
              found = True
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)
              print(f"VALID JSON: {path}")
          if not found:
              print("WARNING: no .ipynb files found")
          PY
      - name: Reject secrets and runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          forbidden='^(\.env$|data/(api_key|restart_secret|tunnel_url)\.txt$|data/environment\.json$|state/(?!\.gitkeep$)|bin/cloudflared$)'
          bad="$(git ls-files | grep -P "$forbidden" || true)"
          if [[ -n "$bad" ]]; then
            echo "Secrets/runtime files must not be tracked:" >&2
            echo "$bad" >&2
            exit 1
          fi
